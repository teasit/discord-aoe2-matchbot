name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  # Called by release-please.yml with the release tag.
  workflow_call:
    inputs:
      ref:
        description: Git tag to build and publish
        type: string
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # Unit tests (no Discord, Steam or Relic Link access needed). They gate the
  # image build for PRs, pushes to main and releases alike.
  test:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: uv sync --locked

    - name: Run tests
      run: uv run pytest

  build:

    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Pull requests only build the image, pushes to main and releases publish it.
    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # main -> :main, release v1.2.3 (called by release-please.yml, or a
    # manually pushed v* tag) -> :latest, :1.2.3, :1.2 and :1, plus :sha-<commit>.
    # :latest is set explicitly only for releases (flavor latest=false stops
    # metadata-action from adding it on its own).
    - name: Extract image tags and labels
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        flavor: |
          latest=false
        tags: |
          type=raw,value=latest,enable=${{ inputs.ref != '' || startsWith(github.ref, 'refs/tags/v') }}
          type=raw,value=main,enable=${{ inputs.ref == '' && github.ref == 'refs/heads/main' }}
          type=ref,event=pr
          type=semver,pattern={{version}},value=${{ inputs.ref }}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref }}
          type=semver,pattern={{major}},value=${{ inputs.ref }}
          type=sha

    - name: Build and push the Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
